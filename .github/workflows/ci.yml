name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ai-board summarize examples/ai-risk-register.csv --as-of 2026-09-12 --output board-summary.md
      - run: ai-board summarize templates/ai-risk-register.csv --as-of 2026-09-12 --output /dev/null
      - run: ai-board diff examples/ai-risk-register-previous.csv examples/ai-risk-register.csv --as-of 2026-09-12 --output change-report.md
      - run: ai-board check examples/ai-risk-register.csv --as-of 2026-09-12 --max-critical 1 --max-overdue 1
      - name: check fails on a breached threshold
        run: |
          if ai-board check examples/ai-risk-register.csv --as-of 2026-09-12 --max-critical 0; then
            echo 'expected a non-zero exit for a breached threshold' && exit 1
          fi
